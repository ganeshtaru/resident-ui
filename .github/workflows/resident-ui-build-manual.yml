name: Resident UI Manual Push

on:
  workflow_dispatch:

jobs:
  build-resident-ui:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ${{ secrets.dev_namespace_docker_hub }}
      SERVICE_NAME: resident-ui
      SERVICE_LOCATION: resident-ui

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3

      - name: npm install
        run: cd ${{ env.SERVICE_LOCATION }} && npm install --ignore-scripts

      - name: npm build
        run: cd ${{ env.SERVICE_LOCATION }} && npm run build -- --prod --base-href .

      - name: Move dist to root for Docker build context
        run: cp -r ${{ env.SERVICE_LOCATION }}/dist/${{ env.SERVICE_NAME }} ./dist

      - name: Setup branch and env
        run: |
          # Strip git ref prefix from version
          echo "BRANCH_NAME=$(echo ${{ github.ref }} | sed -e 's,.*/\(.*\),\1,')" >> $GITHUB_ENV
          echo "GPG_TTY=$(tty)" >> $GITHUB_ENV
      - name: setup environment
        run: |
          # Strip git ref prefix from version
          echo "BRANCH_NAME=$(echo ${{ github.ref }} | sed -e 's,.*/\(.*\),\1,')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build . --file ${{ env.SERVICE_LOCATION }}/Dockerfile --tag ${{ env.SERVICE_NAME }}

      - name: Log into Docker registry
        run: echo "${{ secrets.release_docker_hub }}" | docker login -u ${{ secrets.actor_docker_hub }} --password-stdin

      - name: Push Docker image
        run: |
          IMAGE_ID=$NAMESPACE/$SERVICE_NAME

          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=$BRANCH_NAME
          echo "Push version: $VERSION"
          echo "Image ID: $IMAGE_ID"
          docker tag $SERVICE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
